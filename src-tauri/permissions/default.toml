identifier = "flowplayer:default"
description = "FlowPlayer custom commands"
permissions = [
  "allow-pause",
  "allow-resume",
  "allow-seek",
  "allow-next",
  "allow-previous",
  "allow-set-volume",
  "allow-get-state",
  "allow-set-playlist",
  "allow-set-shuffle",
  "allow-set-repeat",
  "allow-search",
  "allow-play-url",
  "allow-list-radio-stations",
  "allow-update-smtc-metadata",
  "allow-youtube-library",
  "allow-youtube-search",
  "allow-youtube-inspect",
  "allow-youtube-enqueue",
  "allow-youtube-cancel",
  "allow-youtube-retry",
  "allow-fetch-lyrics",
  "allow-scan-folder",
  "allow-get-cover",
  "allow-get-track-info",
  "allow-get-config",
  "allow-set-config",
  "allow-set-window-mode",
  "allow-record-play",
  "allow-get-history",
  "allow-clear-history"
]

